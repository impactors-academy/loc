# LOC — production stack for Coolify.
#
# Self-contained on purpose. Coolify's Docker Compose resource takes a single
# compose file path and cannot apply an override, so the split
# docker-compose.yml + docker-compose.prod.yml arrangement would silently
# deploy the DEV stack: hot reload, source mounts, published DB ports and
# pgAdmin. Point Coolify at this file instead.
#
# docker-compose.yml + docker-compose.prod.yml remain the local dev setup.
# Any change to service topology must be made in both places.
#
# Full setup, env vars and verification: docs/DEPLOYMENT.md

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    # No ports: — reachable only inside the compose network. Never publish this.
    volumes:
      - loc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # Cache only — persistence deliberately off, nothing here needs surviving a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    # Migrations run before the server starts, so a deploy that changes the
    # schema cannot serve traffic against the old one.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS — e.g. ["https://loctravels.com"]}
      # Gates every write endpoint and all /leads routes. Fails closed.
      EDITOR_API_KEY: ${EDITOR_API_KEY:?set EDITOR_API_KEY — editor endpoints return 503 without it}
      ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@loctravels.com}
      EMAIL_TO: ${EMAIL_TO:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at BUILD time. Changing it needs a
        # rebuild, not a restart. Must be the public API hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL — e.g. https://api.loctravels.com}
    restart: always
    command: node server.js
    environment:
      NODE_ENV: production
      # Server-to-server inside the compose network — not the public hostname.
      API_INTERNAL_URL: http://backend:8000
      # Runtime only. Never a build arg, never NEXT_PUBLIC_* — that would inline
      # the key into the browser bundle and hand every visitor write access.
      EDITOR_API_KEY: ${EDITOR_API_KEY:?set EDITOR_API_KEY — the admin CMS cannot publish without it}
      # Cloudflare Access, verified at the origin by frontend/middleware.ts. Neither is
      # secret, but both are required: unset in production means /admin and
      # /api/admin/* return 503 rather than serving unauthenticated. Required here
      # because the edge policy only covers traffic that arrives via Cloudflare.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?set CF_ACCESS_TEAM_DOMAIN — e.g. your-team.cloudflareaccess.com}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?set CF_ACCESS_AUD — the Access application AUD tag}
    expose:
      - "3000"
    depends_on:
      - backend

volumes:
  loc_pgdata:
